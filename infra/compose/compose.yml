name: zhiban

x-api-environment: &api-environment
  APP_ENV: development
  APP_VERSION: 0.1.0
  LOG_LEVEL: INFO
  DEMO_MODE: "true"
  WEB_ORIGIN: http://localhost:3000
  SESSION_SECRET: local-compose-session-secret-change-me
  DATABASE_URL: postgresql+asyncpg://zhiban:zhiban_dev_only@postgres:5432/zhiban
  REDIS_URL: redis://redis:6379/0
  LLM_PROVIDER: mock
  SEARCH_PROVIDER: mock

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: zhiban
      POSTGRES_USER: zhiban
      POSTGRES_PASSWORD: zhiban_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiban -d zhiban"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment: *api-environment
    command:
      - sh
      - -c
      - alembic -c apps/api/alembic.ini upgrade head && uvicorn zhiban.main:app --app-dir apps/api/src --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment: *api-environment
    command: ["python", "-m", "zhiban.workers.main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
