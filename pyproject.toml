[project]
name = "zhiban-workspace"
version = "0.1.0"
description = "Spec-driven AI personal assistant backend workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi",
    "httpx2>=2.10.0",
    "passlib[argon2]>=1.7.4",
    "pgvector>=0.5.0",
    "pydantic-settings",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = "-ra"
pythonpath = ["apps/api/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: requires a real PostgreSQL (pgvector) and Redis",
]
